name: Descargar y procesar NISAR (en la nube)

on:
  workflow_dispatch:
    inputs:
      fechas:
        description: "Cuantas fechas descargar (3 = rapido, 6 = recomendado)"
        default: "6"
      track:
        description: "Orbita (track) recomendada"
        default: "75"

permissions:
  contents: write

jobs:
  nisar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Liberar espacio en disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar librerias
        run: pip install numpy h5py pyproj asf_search rasterio
      - name: Descargar imagenes NISAR (ASF)
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python Yaku_v05.py descargar --track "${{ inputs.track }}" --max-fechas "${{ inputs.fechas }}" --salida datos_nisar_cachi --si
      - name: Procesar (agua, bofedales y volumenes)
        run: |
          mkdir -p datos
          python Yaku_v05.py procesar --entrada datos_nisar_cachi --pixel 60 --agua-auto \
            --salida datos/yaku_cachi.json --csv datos/yaku_cachi_resumen.csv
      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "yaku-bot"
          git config user.email "yaku-bot@users.noreply.github.com"
          git add datos/yaku_cachi.json datos/yaku_cachi_resumen.csv
          git commit -m "Datos NISAR procesados $(date -u +%F)" || echo "sin cambios"
          git pull --rebase && git push
